<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram WebApp Auth Example</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      /* Will be updated by Telegram theme */
      background-color: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    
    .container {
      max-width: 400px;
      width: 100%;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }
    
    .user-card {
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      border-radius: 1rem;
      padding: 1.5rem;
      text-align: center;
    }
    
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 1rem;
      background: var(--tg-theme-button-color, #007bff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--tg-theme-button-text-color, #fff);
      margin: 0 auto 1rem;
    }
    
    .name {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    
    .username {
      color: var(--tg-theme-hint-color, #888);
    }
    
    .status {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.9rem;
    }
    
    .status--success {
      background: #c6f6d5;
      color: #22543d;
    }
    
    .status--error {
      background: #fed7d7;
      color: #9b2c2c;
    }
    
    .status--loading {
      background: #e2e8f0;
      color: #4a5568;
    }
    
    .not-telegram {
      text-align: center;
      padding: 2rem;
    }
    
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: var(--tg-theme-button-color, #007bff);
      color: var(--tg-theme-button-text-color, #fff);
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✈️ Telegram Auth</h1>
    
    <div id="telegram-content" style="display: none;">
      <div class="user-card">
        <div class="avatar" id="avatar"></div>
        <div class="name" id="name">Loading...</div>
        <div class="username" id="username"></div>
      </div>
      
      <div class="status status--loading" id="status">
        Verifying authentication...
      </div>
    </div>
    
    <div id="not-telegram" class="not-telegram" style="display: none;">
      <h2>🚫 Not a Telegram WebApp</h2>
      <p>This page must be opened from within Telegram.</p>
      <p style="margin-top: 1rem; color: #888;">
        To test, open your Telegram bot and click the button that opens this Mini App.
      </p>
    </div>
  </div>

  <script type="module">
    import {
      isTelegramWebApp,
      getTelegramUser,
      getTelegramInitData,
      initTelegramWebApp,
      expandTelegramWebApp,
    } from 'auth-kit-js/frontend';
    
    const AUTH_SERVER = 'http://localhost:3000';
    
    // Check if running in Telegram
    if (!isTelegramWebApp()) {
      document.getElementById('not-telegram').style.display = 'block';
    } else {
      // Show Telegram content
      document.getElementById('telegram-content').style.display = 'block';
      
      // Initialize WebApp
      initTelegramWebApp();
      expandTelegramWebApp();
      
      // Get user info (for display only - this is unverified!)
      const user = getTelegramUser();
      
      if (user) {
        const initials = [user.first_name, user.last_name]
          .filter(Boolean)
          .map(n => n[0])
          .join('');
        
        document.getElementById('avatar').textContent = initials || '?';
        document.getElementById('name').textContent = 
          [user.first_name, user.last_name].filter(Boolean).join(' ');
        document.getElementById('username').textContent = 
          user.username ? `@${user.username}` : '';
      }
      
      // Verify with backend
      verifyWithBackend();
    }
    
    async function verifyWithBackend() {
      const statusEl = document.getElementById('status');
      
      try {
        const initData = getTelegramInitData();
        
        if (!initData) {
          throw new Error('No initData available');
        }
        
        const response = await fetch(`${AUTH_SERVER}/auth/telegram/webapp`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ initData }),
        });
        
        const result = await response.json();
        
        if (result.success) {
          statusEl.className = 'status status--success';
          statusEl.innerHTML = `
            ✅ Authentication verified!<br>
            <small>Token: ${result.token.slice(0, 20)}...</small>
          `;
          
          // Store token for future API calls
          localStorage.setItem('auth_token', result.token);
        } else {
          throw new Error(result.error || 'Verification failed');
        }
      } catch (error) {
        statusEl.className = 'status status--error';
        statusEl.textContent = `❌ Error: ${error.message}`;
      }
    }
  </script>
</body>
</html>
